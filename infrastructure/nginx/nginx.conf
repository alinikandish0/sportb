user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;

  upstream api_upstream {
    server api:3000;
  }

  upstream web_upstream {
    server web:3000;
  }

  upstream admin_upstream {
    server admin:3000;
  }

  upstream partner_upstream {
    server partner:3000;
  }

  # اپ اصلی (web) + api — روی دامنه‌ی پیش‌فرض
  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # پنل ادمین — روی ساب‌دامین جدا (برای تست لوکال باید تو hosts فایل ست بشه)
  server {
    listen 80;
    server_name admin.platform.local;

    location / {
      proxy_pass http://admin_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # پنل همکاران — روی ساب‌دامین جدا
  server {
    listen 80;
    server_name partner.platform.local;

    location / {
      proxy_pass http://partner_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}